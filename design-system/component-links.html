<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { background: hsl(220 50% 16%); }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .link {
    color: hsl(300 80% 80%);
    text-decoration: none;
    border-bottom: 1px dashed hsl(300 80% 80% / 0.4);
    font-family: var(--font-body);
    font-size: 16px;
    padding-bottom: 1px;
  }
  .link:hover { color: hsl(300 80% 90%); }
  .ext { font-family: 'FontAwesome', sans-serif; font-size: 12px; margin-left: 4px; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid hsl(300 80% 80% / 0.6);
    color: hsl(300 80% 90%);
    font-family: var(--font-body);
    font-size: 13px;
    text-decoration: none;
  }
  .pill svg { width: 14px; height: 14px; fill: currentColor; }
  .meta { font-family: var(--font-mono); font-size: 10px; opacity: 0.55; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 14px; }
</style>
</head>
<body>
